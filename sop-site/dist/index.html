<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>五方入味 · 现场 SOP</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">五方入味 <span>COMPASS OF TASTE</span></div><span class="tag">现场出餐 · SOP</span></header><main><section class="top"><div class="progress"><strong id="count"></strong><span>环节已完成</span><progress id="progress"></progress></div></section><nav id="stages" aria-label="活动环节"></nav><section class="card" aria-live="polite"><div class="meta"><span id="phase"></span><span id="number"></span></div><div class="task"><div class="symbol" aria-hidden="true">✳</div><div><p id="context"></p><h2 id="title"></h2></div></div><div class="columns"><section><h3>流程 <small>现场与上餐</small></h3><ul id="flow"></ul></section><section><h3>餐饮 <small>厨房与茶饮</small></h3><ul id="food"></ul></section></div><div class="cardfoot"><span id="status"></span><button id="undo" class="textbutton">撤销此步完成</button></div></section><div class="nextline"><span>接下来</span><strong id="upnext"></strong><button id="current" class="textbutton">返回当前待办 ↗</button></div><section class="controls" aria-label="步骤操作"><button id="prev">← 上一步 <small>Previous</small></button><button id="complete" class="primary">✓ 标记完成并继续 <small>Mark Complete</small></button><button id="next">下一步 → <small>Next</small></button></section><footer><span id="save">进度保存在这台设备 · 前后浏览不会标记完成</span><button id="reset" class="textbutton">重新开始</button></footer></main><dialog id="resetDialog"><h2>重新开始本场流程？</h2><p>将清除这台设备的全部完成记录。</p><form method="dialog"><button value="cancel">保留进度</button><button value="reset" class="primary">确认重新开始</button></form></dialog><script type="module" src="app.js"></script></body></html>
