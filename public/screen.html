<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装置画面 · 五方入味</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body data-page="screen"><div class="canvas-wrap" id="canvas-wrap"><canvas id="ink" aria-label="五城水墨互动动画"></canvas></div><div id="screen-settings"><span id="connection" role="status"></span><label><input id="paper-toggle" type="checkbox" checked> 模拟宣纸</label><label>宣纸高度 <output id="paper-value">50%</output><input id="paper-height" type="range" min="30" max="70" value="50"></label><div><label for="city-font-size">城市名字字号 <output id="city-font-value">100%</output></label><input id="city-font-size" type="range" min="60" max="200" step="5" value="100"><label for="particle-size">粒子大小 <output id="particle-value">100%</output></label><input id="particle-size" type="range" min="50" max="300" step="10" value="100"></div><label>背景<select id="background"><option value="#eeefeb">浅灰预览</option><option value="#ffffff">白色</option><option value="#000000">黑色</option><option value="transparent">透明</option></select></label><button id="fullscreen">全屏</button><span>H 隐藏设置 · Esc 退出全屏</span></div><script type="module" src="/app.js"></script></body></html>
