<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装置画面 · 五方入味</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body data-page="screen"><div class="canvas-wrap" id="canvas-wrap"><canvas id="ink" aria-label="五城水墨互动动画"></canvas></div><div id="screen-settings"><span id="connection" role="status"></span><label><input id="paper-toggle" type="checkbox" checked> 模拟宣纸</label><label for="paper-top">宣纸上边位置 <output id="paper-top-value">25%</output></label><input id="paper-top" type="range" min="0" max="90" value="25"><label for="paper-bottom">宣纸下边位置 <output id="paper-bottom-value">75%</output></label><input id="paper-bottom" type="range" min="10" max="100" value="75"><div><label><input id="landscape-toggle" type="checkbox" checked> 显示水墨山水</label><label for="ripple-city">持续水墨涟漪</label><select id="ripple-city"><option value="">关闭</option><option value="guangzhou">广州</option><option value="xian">西安</option><option value="nanjing">南京</option><option value="puer">普洱</option><option value="shenyang">沈阳</option></select><label for="city-font-size">城市名字字号 <output id="city-font-value">100%</output></label><input id="city-font-size" type="range" min="60" max="200" step="5" value="100"><label for="particle-size">粒子大小 <output id="particle-value">100%</output></label><input id="particle-size" type="range" min="50" max="300" step="10" value="100"></div><label>背景<select id="background"><option value="#eeefeb">浅灰预览</option><option value="#ffffff">白色</option><option value="#000000">黑色</option><option value="transparent">透明</option></select></label><button id="fullscreen">全屏</button><span>H 隐藏设置 · Esc 退出全屏</span></div><script type="module" src="/app.js"></script></body></html>
